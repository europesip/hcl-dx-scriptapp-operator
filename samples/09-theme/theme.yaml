# 09 · A theme of its own: the EUROPESIP sample theme (https://github.com/europesip/hcl-dx-theme-sample), written from
# scratch, with templates, layouts and stylesheet of its own. The operator downloads the theme archive of the release
# (checked with its SHA256), uploads it to the WebDAV store of DX and registers it with XMLAccess; nothing is copied from
# the themes of HCL (base.copyFiles: false). The page uses it with spec.theme. It works the same with and without OIDC
# (the operator uses basic auth for WebDAV and XMLAccess).
apiVersion: dx.europesip.com/v1alpha1
kind: DXTheme
metadata:
  name: europesip
spec:
  connectionRef: { name: dx }
  uniqueName: europesip.theme.sample
  titles: { en: "EUROPESIP", es: "EUROPESIP" }
  description: EUROPESIP sample theme
  base: { copyFiles: false }        # a theme of its own: only the files of the source are uploaded
  source:
    url:
      url: https://github.com/europesip/hcl-dx-theme-sample/releases/download/v1.0.0/europesip-theme-1.0.0.tar.gz
      sha256: bcb2aaec16f7b7ded4562049d75e2969957c3de4d0262ef9a2ba47459d9ed0c9
  profile: profiles/profile_europesip.json
  layout: layout-templates/1Column
  deletionPolicy: Delete            # delete its registration and its folder when this resource is deleted
---
apiVersion: dx.europesip.com/v1alpha1
kind: DXPage
metadata:
  name: dxop-themed
spec:
  connectionRef: { name: dx }
  friendlyName: dxop-themed
  titles: { en: "DXOP Themed", es: "DXOP Con tema" }
  ordinal: 910
  theme: europesip.theme.sample     # the unique name of the DXTheme above
  layoutTemplate: dav:fs-type1/themes/europesip/layout-templates/1Column
  applications:
    - name: dxop-hello
  dependsOn:
    - { kind: DXTheme, name: europesip }
  deletionPolicy: Delete
