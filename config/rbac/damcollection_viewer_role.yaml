# This rule is not used by the project hcl-dx-scriptapp-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to dx.europesip.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hcl-dx-scriptapp-operator
    app.kubernetes.io/managed-by: kustomize
  name: damcollection-viewer-role
rules:
- apiGroups:
  - dx.europesip.com
  resources:
  - damcollections
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dx.europesip.com
  resources:
  - damcollections/status
  verbs:
  - get
