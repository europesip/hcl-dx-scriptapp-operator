---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: scriptapplications.dx.europesip.com
spec:
  group: dx.europesip.com
  names:
    kind: ScriptApplication
    listKind: ScriptApplicationList
    plural: scriptapplications
    shortNames:
    - scriptapp
    - sa
    singular: scriptapplication
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.wcm.name
      name: WCM name
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.contentId
      name: Content ID
      priority: 1
      type: string
    - jsonPath: .status.lastPushTime
      name: Last push
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ScriptApplication is an HCL DX Script Application, kept in DX
          as the resource declares.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ScriptApplicationSpec is a Script Application as it must
              be in DX.
            properties:
              connectionRef:
                description: 'ConnectionRef: the DXConnection to use.'
                properties:
                  name:
                    description: Name of the object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy: Retain (default) leaves the application in DX when the resource is deleted; Delete
                  removes it (pages that use it then show an error).
                enum:
                - Retain
                - Delete
                type: string
              dependsOn:
                description: 'DependsOn: objects that must be ready first (for example
                  the Deployment of the backend).'
                items:
                  description: Dependency is an object that must be ready before the
                    resource is reconciled.
                  properties:
                    apiVersion:
                      description: APIVersion of the object, for example apps/v1 (default)
                        or dx.europesip.com/v1alpha1.
                      type: string
                    kind:
                      description: 'Kind: Deployment, StatefulSet, Job, ScriptApplication,
                        DXPage, DAMCollection, PostgresDatabase or DXTheme.'
                      enum:
                      - Deployment
                      - StatefulSet
                      - Job
                      - ScriptApplication
                      - DXPage
                      - DAMCollection
                      - PostgresDatabase
                      - DXTheme
                      type: string
                    name:
                      description: Name of the object, in the same namespace.
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              driftPolicy:
                default: Restore
                description: |-
                  DriftPolicy: Restore (default) pushes again if the application was deleted or edited in DX; Report only
                  reports it.
                enum:
                - Restore
                - Report
                type: string
              mode:
                default: Push
                description: 'Mode: Push (default) or Verify.'
                enum:
                - Push
                - Verify
                type: string
              source:
                description: Source of the built application (the content of dist/).
                properties:
                  configMap:
                    description: |-
                      ConfigMap: every key of the ConfigMap is a file (data and binaryData). Handy for small applications:
                      a ConfigMap and its Secret are limited to 1 MiB. Keys cannot contain "/", so a key "assets__app.js"
                      becomes the file "assets/app.js".
                    properties:
                      name:
                        description: Name of the ConfigMap.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  image:
                    description: |-
                      Image: an OCI image (a "bundle image") that carries the files. The operator reads its layers directly
                      from the registry: nothing runs in the cluster. Use a digest (repo@sha256:...) for immutable deployments.
                    properties:
                      path:
                        default: /app
                        description: Path inside the image where the files are (default
                          /app).
                        type: string
                      pullSecrets:
                        description: 'PullSecrets: Secrets of type kubernetes.io/dockerconfigjson
                          for a private registry.'
                        items:
                          description: LocalObjectReference names an object in the
                            same namespace.
                          properties:
                            name:
                              description: Name of the object.
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                      ref:
                        description: Reference of the image, for example ghcr.io/acme/my-app:1.2.0
                          or ghcr.io/acme/my-app@sha256:...
                        minLength: 1
                        type: string
                    required:
                    - ref
                    type: object
                  url:
                    description: |-
                      URL: a .tar.gz, .tgz or .zip archive downloaded over HTTP(S), for example a CI artifact or a GitHub
                      release asset.
                    properties:
                      path:
                        description: 'Path inside the archive where the files are
                          (default: the root).'
                        type: string
                      sha256:
                        description: |-
                          SHA256 of the archive (hex). Recommended: the download is rejected if it does not match, and the
                          operator only downloads it again when this value changes.
                        type: string
                      url:
                        description: URL of a .tar.gz, .tgz or .zip archive.
                        pattern: ^https?://
                        type: string
                    required:
                    - url
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of image, configMap or url
                  rule: '(has(self.image) ? 1 : 0) + (has(self.configMap) ? 1 : 0)
                    + (has(self.url) ? 1 : 0) == 1'
              substitutions:
                description: Substitutions of ${NAME} placeholders in the text files.
                items:
                  description: |-
                    Substitution replaces ${NAME} in the text files of the application (.html, .js, .mjs, .css, .json, .txt,
                    .svg) before the push. It lets the same build run in every environment: URLs of the backend, of DAM
                    assets, feature flags...
                  properties:
                    name:
                      description: 'Name of the placeholder: ${NAME} in the files.'
                      pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                      type: string
                    value:
                      description: Value, as is.
                      type: string
                    valueFrom:
                      description: |-
                        ValueFrom: a key of a ConfigMap or a Secret, or the URL of an asset of a DAMCollection (which then
                        becomes a dependency).
                      properties:
                        configMapKeyRef:
                          description: ConfigMapKeySelector selects a key of a ConfigMap
                            in the same namespace.
                          properties:
                            key:
                              type: string
                            name:
                              type: string
                          required:
                          - key
                          - name
                          type: object
                        damAsset:
                          description: 'DAMAsset: the URL of an asset of a DAMCollection
                            in the same namespace.'
                          properties:
                            asset:
                              description: 'Asset: file name of the asset in the collection.'
                              type: string
                            collection:
                              description: 'Collection: name of the DAMCollection
                                resource.'
                              type: string
                          required:
                          - asset
                          - collection
                          type: object
                        secretKeyRef:
                          description: 'SecretKeyRef: remember that the value ends
                            up in a file every visitor can download.'
                          properties:
                            key:
                              type: string
                            name:
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      type: object
                  required:
                  - name
                  type: object
                type: array
              suspend:
                description: 'Suspend: stop reconciling (nothing is pushed or checked).'
                type: boolean
              wcm:
                description: WCM settings.
                properties:
                  mainHtmlFile:
                    default: index.html
                    description: MainHTMLFile of the application (default index.html).
                    type: string
                  name:
                    description: |-
                      Name of the WCM content: the key that makes a push an update. Default: the name of the resource.
                      Do not change it after the first push (a new name creates a second application).
                    type: string
                  projectContext:
                    description: 'ProjectContext: push into this WCM project instead
                      of publishing at once (the project must exist).'
                    type: string
                  siteArea:
                    default: Script Application Library/Script Applications/
                    description: SiteArea where it is created (default "Script Application
                      Library/Script Applications/").
                    type: string
                  title:
                    description: 'Title shown in DX (default: the WCM name).'
                    type: string
                type: object
            required:
            - connectionRef
            - source
            type: object
          status:
            description: ScriptApplicationStatus is what the operator knows about
              the application in DX.
            properties:
              appliedHash:
                description: 'AppliedHash: hash of everything pushed (files after
                  substitutions and WCM settings).'
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contentId:
                description: ContentID of the application in WCM.
                type: string
              files:
                description: Files and Size of the last push.
                type: integer
              history:
                description: 'History of the last pushes (newest first, at most 10):
                  to go back, set the source of one of them.'
                items:
                  description: PushRecord is one push of the application.
                  properties:
                    reason:
                      type: string
                    sourceRevision:
                      type: string
                    time:
                      format: date-time
                      type: string
                  required:
                  - reason
                  - sourceRevision
                  - time
                  type: object
                type: array
              lastCheckTime:
                format: date-time
                type: string
              lastPushTime:
                description: LastPushTime and LastCheckTime.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              size:
                type: string
              sourceRevision:
                description: 'SourceRevision: digest of the source that was pushed
                  (image digest, ConfigMap hash or archive SHA256).'
                type: string
              wcmLastModified:
                description: |-
                  WCMLastModified: last modification date of the content in WCM after the operator's push. A different
                  date means somebody changed it in DX.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
