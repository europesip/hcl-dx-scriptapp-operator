name: "🐞 Bug"
description: Something does not behave as it should.
title: "[Bug] "
projects: ["europesip/3"]
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. **Never paste credentials, keys, tokens or licence data**: replace them with `***`.
  - type: input
    id: version
    attributes:
      label: Version
      description: "The chart or image version (helm list -n <namespace>), for example 0.3.1."
    validations: {required: true}
  - type: dropdown
    id: where
    attributes:
      label: Where does it fail?
      options:
        - "DXScriptApplication"
        - "DXPage"
        - "DXTheme"
        - "DXDamCollection"
        - "DXDatabase"
        - "DXConnection"
        - "Installing or upgrading the Helm chart"
        - "Argo CD / GitOps"
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations: {required: true}
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`kubectl get <kind> <name> -o yaml` (status and events) and the operator logs, without secrets."
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "RKE2 1.33, DX Compose CF239, operator 0.3.1, Argo CD 3.6"
  - type: textarea
    id: done
    attributes:
      label: How do we know it is fixed?
      description: The check that must pass after the fix (it becomes the acceptance criterion).
      value: |
        - [ ]
