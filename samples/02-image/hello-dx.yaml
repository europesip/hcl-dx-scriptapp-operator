# 02 · A real React Script Application (Hello DX) from a bundle image: the operator reads the built files
# straight from the registry (nothing runs in the cluster). Pin a digest for immutable deployments.
apiVersion: dx.europesip.com/v1alpha1
kind: DXScriptApplication
metadata:
  name: dxop-hello-dx
spec:
  connectionRef: { name: dx }
  source:
    image:
      ref: ghcr.io/europesip/hcl-dx-scriptapp-helm/europesip-hello-dx:1.0.4
      path: /app
  wcm:
    title: "DXOP · Hello DX (React)"
---
apiVersion: dx.europesip.com/v1alpha1
kind: DXPage
metadata:
  name: dxop-hello-dx
spec:
  connectionRef: { name: dx }
  titles: { en: "DXOP Hello DX", es: "DXOP Hola DX" }
  applications:
    - name: dxop-hello-dx
