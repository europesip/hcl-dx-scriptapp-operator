# Tests; the operator image (FROM HCL's public DXClient image) and the sample images on every push to main
# (:main) and on tags vX.Y.Z (:X.Y.Z, :latest); the Helm chart on tags.
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io/europesip/hcl-dx-scriptapp-operator
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - name: Generated code and manifests are up to date
        run: |
          make manifests generate
          ./hack/sync-chart.sh
          git diff --exit-code -- api config charts
      - run: go vet ./...
      - run: go test ./internal/... -count=1
      - name: Sample backend builds
        working-directory: samples/04-backend-db/visits-api
        run: go build ./...
      - uses: azure/setup-helm@v5
      - name: Chart
        run: |
          helm lint charts/hcl-dx-scriptapp-operator --set dxclient.acceptLicense=true
          ! helm template t charts/hcl-dx-scriptapp-operator >/dev/null 2>&1   # refuses without the licence
          v=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' charts/hcl-dx-scriptapp-operator/Chart.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then [ "v$v" = "${GITHUB_REF#refs/tags/}" ]; fi

  images:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: "", context: ".", file: Dockerfile }
          - { name: "/sample-visits-api", context: samples/04-backend-db/visits-api, file: samples/04-backend-db/visits-api/Dockerfile }
          - { name: "/sample-clock", context: samples/05-bundle-image, file: samples/05-bundle-image/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  chart:
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/hcl-dx-scriptapp-operator
          helm push hcl-dx-scriptapp-operator-*.tgz oci://ghcr.io/europesip/charts
