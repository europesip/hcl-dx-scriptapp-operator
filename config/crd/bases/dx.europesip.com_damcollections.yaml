---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: damcollections.dx.europesip.com
spec:
  group: dx.europesip.com
  names:
    kind: DAMCollection
    listKind: DAMCollectionList
    plural: damcollections
    shortNames:
    - dam
    singular: damcollection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.collectionName
      name: Collection
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DAMCollection is a collection of the HCL DX Digital Asset Management,
          kept as the resource declares.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DAMCollectionSpec is a collection of the DX Digital Asset
              Management with the files of a source.
            properties:
              access:
                description: 'Access: who can read the assets (default: all authenticated
                  users; anonymous for public images).'
                properties:
                  anonymous:
                    description: 'Anonymous: visitors who are not signed in.'
                    type: boolean
                  authenticated:
                    default: true
                    description: 'Authenticated: all authenticated portal users (default
                      true).'
                    type: boolean
                type: object
              collectionName:
                description: 'CollectionName in the DAM (default: the name of the
                  resource). The key that finds the same collection.'
                type: string
              connectionRef:
                description: 'ConnectionRef: the DXConnection to use.'
                properties:
                  name:
                    description: Name of the object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy: Retain (default) leaves the collection in the DAM when the resource is deleted; Delete
                  removes it with its assets.
                enum:
                - Retain
                - Delete
                type: string
              dependsOn:
                description: 'DependsOn: other objects that must be ready first.'
                items:
                  description: Dependency is an object that must be ready before the
                    resource is reconciled.
                  properties:
                    apiVersion:
                      description: APIVersion of the object, for example apps/v1 (default)
                        or dx.europesip.com/v1alpha1.
                      type: string
                    kind:
                      description: 'Kind: Deployment, StatefulSet, Job, ScriptApplication,
                        DXPage, DAMCollection, PostgresDatabase or DXTheme.'
                      enum:
                      - Deployment
                      - StatefulSet
                      - Job
                      - ScriptApplication
                      - DXPage
                      - DAMCollection
                      - PostgresDatabase
                      - DXTheme
                      type: string
                    name:
                      description: Name of the object, in the same namespace.
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              description:
                description: Description of the collection.
                type: string
              driftPolicy:
                default: Restore
                description: 'DriftPolicy: Restore (default) uploads again what was
                  deleted or replaced in DX; Report only reports it.'
                enum:
                - Restore
                - Report
                type: string
              prune:
                description: 'Prune: delete the assets of the collection that are
                  no longer in the source (default false).'
                type: boolean
              source:
                description: 'Source of the files: every file becomes an asset, named
                  after its path (subfolders flattened with "-").'
                properties:
                  configMap:
                    description: |-
                      ConfigMap: every key of the ConfigMap is a file (data and binaryData). Handy for small applications:
                      a ConfigMap and its Secret are limited to 1 MiB. Keys cannot contain "/", so a key "assets__app.js"
                      becomes the file "assets/app.js".
                    properties:
                      name:
                        description: Name of the ConfigMap.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  image:
                    description: |-
                      Image: an OCI image (a "bundle image") that carries the files. The operator reads its layers directly
                      from the registry: nothing runs in the cluster. Use a digest (repo@sha256:...) for immutable deployments.
                    properties:
                      path:
                        default: /app
                        description: Path inside the image where the files are (default
                          /app).
                        type: string
                      pullSecrets:
                        description: 'PullSecrets: Secrets of type kubernetes.io/dockerconfigjson
                          for a private registry.'
                        items:
                          description: LocalObjectReference names an object in the
                            same namespace.
                          properties:
                            name:
                              description: Name of the object.
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                      ref:
                        description: Reference of the image, for example ghcr.io/acme/my-app:1.2.0
                          or ghcr.io/acme/my-app@sha256:...
                        minLength: 1
                        type: string
                    required:
                    - ref
                    type: object
                  url:
                    description: |-
                      URL: a .tar.gz, .tgz or .zip archive downloaded over HTTP(S), for example a CI artifact or a GitHub
                      release asset.
                    properties:
                      path:
                        description: 'Path inside the archive where the files are
                          (default: the root).'
                        type: string
                      sha256:
                        description: |-
                          SHA256 of the archive (hex). Recommended: the download is rejected if it does not match, and the
                          operator only downloads it again when this value changes.
                        type: string
                      url:
                        description: URL of a .tar.gz, .tgz or .zip archive.
                        pattern: ^https?://
                        type: string
                    required:
                    - url
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of image, configMap or url
                  rule: '(has(self.image) ? 1 : 0) + (has(self.configMap) ? 1 : 0)
                    + (has(self.url) ? 1 : 0) == 1'
              suspend:
                description: 'Suspend: stop reconciling.'
                type: boolean
            required:
            - connectionRef
            - source
            type: object
          status:
            description: DAMCollectionStatus is what the operator knows about the
              collection.
            properties:
              assets:
                description: Assets of the collection managed by the operator.
                items:
                  description: DAMAssetStatus is one asset of the collection.
                  properties:
                    id:
                      description: ID of the asset in the DAM.
                      type: string
                    name:
                      description: Name of the asset (the file name).
                      type: string
                    sha256:
                      description: SHA256 of the uploaded file.
                      type: string
                    url:
                      description: URL of its original rendition, relative to the
                        DX host (usable in pages and Script Applications).
                      type: string
                  required:
                  - id
                  - name
                  - sha256
                  type: object
                type: array
              collectionId:
                description: CollectionID in the DAM.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              sourceRevision:
                description: SourceRevision that was uploaded.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
