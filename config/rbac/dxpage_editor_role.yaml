# This rule is not used by the project hcl-dx-scriptapp-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the dx.europesip.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hcl-dx-scriptapp-operator
    app.kubernetes.io/managed-by: kustomize
  name: dxpage-editor-role
rules:
- apiGroups:
  - dx.europesip.com
  resources:
  - dxpages
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dx.europesip.com
  resources:
  - dxpages/status
  verbs:
  - get
