---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: dxthemes.dx.europesip.com
spec:
  group: dx.europesip.com
  names:
    kind: DXTheme
    listKind: DXThemeList
    plural: dxthemes
    shortNames:
    - dxtheme
    singular: dxtheme
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.uniqueName
      name: Unique name
      type: string
    - jsonPath: .status.files
      name: Files
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DXTheme is a theme of HCL DX Compose (WebDAV based), kept in
          DX as the resource declares.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DXThemeSpec is a DX theme (WebDAV based): a copy of a base theme of the same DX, with the files of a source and
              optional HTML added to the head of its templates, registered with XMLAccess.
            properties:
              base:
                description: 'Base theme copied first (default: Portal 8.5).'
                properties:
                  folder:
                    default: Portal8.5
                    description: 'Folder of the base theme in the WebDAV store (default:
                      Portal8.5, the HCL DX Portal 8.5 theme).'
                    type: string
                  uniqueName:
                    default: ibm.portal.85Theme
                    description: 'UniqueName of the base theme registration (default:
                      ibm.portal.85Theme).'
                    type: string
                type: object
              connectionRef:
                description: 'ConnectionRef: the DXConnection to use.'
                properties:
                  name:
                    description: Name of the object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy: Retain (default) leaves the theme in DX when the resource is deleted; Delete removes its
                  registration and its folder (pages that use it fall back to the default theme).
                enum:
                - Retain
                - Delete
                type: string
              dependsOn:
                description: 'DependsOn: other objects that must be ready first.'
                items:
                  description: Dependency is an object that must be ready before the
                    resource is reconciled.
                  properties:
                    apiVersion:
                      description: APIVersion of the object, for example apps/v1 (default)
                        or dx.europesip.com/v1alpha1.
                      type: string
                    kind:
                      description: 'Kind: Deployment, StatefulSet, Job, ScriptApplication,
                        DXPage, DAMCollection, PostgresDatabase or DXTheme.'
                      enum:
                      - Deployment
                      - StatefulSet
                      - Job
                      - ScriptApplication
                      - DXPage
                      - DAMCollection
                      - PostgresDatabase
                      - DXTheme
                      type: string
                    name:
                      description: Name of the object, in the same namespace.
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              description:
                description: Description of the theme.
                type: string
              driftPolicy:
                default: Restore
                description: |-
                  DriftPolicy: Restore (default) uploads and registers it again if the theme or its folder was deleted in DX;
                  Report only reports it.
                enum:
                - Restore
                - Report
                type: string
              folder:
                description: 'Folder of the theme in the WebDAV store (dav:fs-type1/themes/<folder>/).
                  Default: the name of the resource.'
                type: string
              headHTML:
                description: |-
                  HeadHTML: HTML inserted before </head> in every theme template (theme.html, theme_sidenav.html and their language
                  versions): a <style>, a <link> to a file of the source (/wps/mycontenthandler/dav/fs-type1/themes/<folder>/...),
                  a <script>...
                type: string
              source:
                description: |-
                  Source: files added to (or replacing in) the copy of the base theme, at the same paths (for example
                  css/my.css or images/logo.png). Optional.
                properties:
                  configMap:
                    description: |-
                      ConfigMap: every key of the ConfigMap is a file (data and binaryData). Handy for small applications:
                      a ConfigMap and its Secret are limited to 1 MiB. Keys cannot contain "/", so a key "assets__app.js"
                      becomes the file "assets/app.js".
                    properties:
                      name:
                        description: Name of the ConfigMap.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  image:
                    description: |-
                      Image: an OCI image (a "bundle image") that carries the files. The operator reads its layers directly
                      from the registry: nothing runs in the cluster. Use a digest (repo@sha256:...) for immutable deployments.
                    properties:
                      path:
                        default: /app
                        description: Path inside the image where the files are (default
                          /app).
                        type: string
                      pullSecrets:
                        description: 'PullSecrets: Secrets of type kubernetes.io/dockerconfigjson
                          for a private registry.'
                        items:
                          description: LocalObjectReference names an object in the
                            same namespace.
                          properties:
                            name:
                              description: Name of the object.
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                      ref:
                        description: Reference of the image, for example ghcr.io/acme/my-app:1.2.0
                          or ghcr.io/acme/my-app@sha256:...
                        minLength: 1
                        type: string
                    required:
                    - ref
                    type: object
                  url:
                    description: |-
                      URL: a .tar.gz, .tgz or .zip archive downloaded over HTTP(S), for example a CI artifact or a GitHub
                      release asset.
                    properties:
                      path:
                        description: 'Path inside the archive where the files are
                          (default: the root).'
                        type: string
                      sha256:
                        description: |-
                          SHA256 of the archive (hex). Recommended: the download is rejected if it does not match, and the
                          operator only downloads it again when this value changes.
                        type: string
                      url:
                        description: URL of a .tar.gz, .tgz or .zip archive.
                        pattern: ^https?://
                        type: string
                    required:
                    - url
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of image, configMap or url
                  rule: '(has(self.image) ? 1 : 0) + (has(self.configMap) ? 1 : 0)
                    + (has(self.url) ? 1 : 0) == 1'
              suspend:
                description: 'Suspend: stop reconciling.'
                type: boolean
              titles:
                additionalProperties:
                  type: string
                description: 'Titles by locale (for example {en: "My theme", es: "Mi
                  tema"}). At least one.'
                minProperties: 1
                type: object
              uniqueName:
                description: UniqueName of the theme registration (default dxop.<namespace>.<name>).
                  Pages refer to it (DXPage spec.theme).
                type: string
            required:
            - connectionRef
            - titles
            type: object
          status:
            description: DXThemeStatus is what the operator knows about the theme.
            properties:
              appliedHash:
                description: 'AppliedHash: hash of what was uploaded and registered
                  (also kept as the theme parameter dxop.hash).'
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              files:
                description: Files uploaded to the WebDAV folder.
                type: integer
              lastApplyTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              sourceRevision:
                description: SourceRevision of the files that were added.
                type: string
              uniqueName:
                description: UniqueName of the registered theme.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
