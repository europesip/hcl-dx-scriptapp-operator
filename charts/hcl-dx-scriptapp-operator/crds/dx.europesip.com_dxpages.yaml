---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: dxpages.dx.europesip.com
spec:
  group: dx.europesip.com
  names:
    kind: DXPage
    listKind: DXPageList
    plural: dxpages
    shortNames:
    - dxp
    singular: dxpage
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.uniqueName
      name: Unique name
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.url
      name: URL
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DXPage is a page of HCL DX that shows Script Applications, kept
          in DX as the resource declares.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DXPageSpec is a DX page that shows one or more Script Applications.
            properties:
              access:
                description: 'Access: who can see the page (default: all authenticated
                  users).'
                properties:
                  anonymous:
                    description: 'Anonymous: visitors who are not signed in.'
                    type: boolean
                  authenticated:
                    default: true
                    description: 'Authenticated: all authenticated portal users (default
                      true).'
                    type: boolean
                type: object
              applications:
                description: |-
                  Applications shown on the page, one under the other: names of ScriptApplication resources in the same
                  namespace (each one in a Web Content Viewer). They become dependencies of the page.
                items:
                  description: LocalObjectReference names an object in the same namespace.
                  properties:
                    name:
                      description: Name of the object.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
              connectionRef:
                description: 'ConnectionRef: the DXConnection to use (its user must
                  be a DX administrator: pages use XMLAccess).'
                properties:
                  name:
                    description: Name of the object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Retain
                description: 'DeletionPolicy: Retain (default) leaves the page in
                  DX when the resource is deleted; Delete removes it.'
                enum:
                - Retain
                - Delete
                type: string
              dependsOn:
                description: 'DependsOn: other objects that must be ready first.'
                items:
                  description: Dependency is an object that must be ready before the
                    resource is reconciled.
                  properties:
                    apiVersion:
                      description: APIVersion of the object, for example apps/v1 (default)
                        or dx.europesip.com/v1alpha1.
                      type: string
                    kind:
                      description: 'Kind: Deployment, StatefulSet, Job, ScriptApplication,
                        DXPage, DAMCollection or PostgresDatabase.'
                      enum:
                      - Deployment
                      - StatefulSet
                      - Job
                      - ScriptApplication
                      - DXPage
                      - DAMCollection
                      - PostgresDatabase
                      type: string
                    name:
                      description: Name of the object, in the same namespace.
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              driftPolicy:
                default: Restore
                description: 'DriftPolicy: Restore (default) recreates the page if
                  it was deleted in DX; Report only reports it.'
                enum:
                - Restore
                - Report
                type: string
              friendlyName:
                description: 'FriendlyName of the page in its URL (default: the name
                  of the resource).'
                type: string
              layoutTemplate:
                default: dav:fs-type1/themes/Portal8.5/layout-templates/1Column
                description: 'LayoutTemplate of the theme (default: the 1 column layout
                  of the Portal 8.5 theme).'
                type: string
              ordinal:
                description: Ordinal of the page among its siblings (optional).
                format: int32
                type: integer
              parent:
                default: ibm.portal.Home
                description: 'Parent: unique name of the parent page (default ibm.portal.Home).'
                type: string
              skin:
                default: ibm.portal.85NoSkin
                description: Skin of the viewers (default ibm.portal.85NoSkin).
                type: string
              suspend:
                description: 'Suspend: stop reconciling.'
                type: boolean
              theme:
                description: 'Theme: unique name of a theme for this page (default:
                  inherited).'
                type: string
              titles:
                additionalProperties:
                  type: string
                description: 'Titles by locale, for example {en: "Time off", es: "Vacaciones"}.'
                minProperties: 1
                type: object
              uniqueName:
                description: |-
                  UniqueName of the page in DX: the key that makes an update find the same page.
                  Default: dxop.<namespace>.<name>. Do not change it after the page is created.
                type: string
            required:
            - applications
            - connectionRef
            - titles
            type: object
          status:
            description: DXPageStatus is what the operator knows about the page.
            properties:
              appliedHash:
                description: 'AppliedHash: hash of the settings applied with XMLAccess.'
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastApplyTime:
                format: date-time
                type: string
              lastCheckTime:
                format: date-time
                type: string
              layoutHash:
                description: |-
                  LayoutHash: hash of the list of applications the layout was built for. The layout (the viewers) is only
                  rebuilt when that list changes, so the settings people make on the page survive other updates.
                type: string
              observedGeneration:
                format: int64
                type: integer
              uniqueName:
                description: UniqueName of the page in DX.
                type: string
              url:
                description: URL of the page (for authenticated users), when the parent
                  is the Home page.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
